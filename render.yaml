services:
  - type: web
    name: phishguard-symposium
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: phishguard-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PHISHGUARD_ADMIN_ID
        sync: false
      - key: PHISHGUARD_ADMIN_PASSWORD_HASH
        sync: false
      - key: PHISHGUARD_SESSION_SECRET
        sync: false
